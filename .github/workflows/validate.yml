name: Validar FAVMED
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar JavaScript e requisitos principais
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); for (const file of ["index.html","consultorio.html"]) { const html=fs.readFileSync(file,"utf8"); const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]; if (!scripts.length) throw new Error(file+" não contém scripts"); scripts.forEach((m,i)=>{new Function(m[1]); console.log(file+" script "+(i+1)+": sintaxe OK");}); } const html=fs.readFileSync("index.html","utf8"); const server=fs.readFileSync("servidor-favmed.ps1","utf8"); for (const term of ["Chamar Recepção 1","Chamar Recepção 2","Chamar Recepção 3","Triglicerídeos","TGO","TGP","Chumbo sanguíneo","Hepatite HBsAg","Hepatite Anti-HBs","Hepatite Anti-HCV","Hepatite B - ANTI-HBC TOTAL","Metil etil cetona","Acetona","Ácido metil-hipúrico","Ácido hipúrico","Ácido delta-aminolevulínico","Teste Vestibular","Teste Otoneurológico","patientPdf","editPatientPdf","savePatientEdits","ASO PENDENTE","receptionclear","grid-template-columns:repeat(2,minmax(0,1fr))","Parar Recepção 1"]) if (!html.includes(term)) throw new Error("Requisito ausente: "+term); if (html.includes("value=\"Sala 5\"")) throw new Error("Sala 5 ainda está disponível"); if (html.includes("Hepatite Anti-HBV") || html.includes('value="Ácido Metil"') || html.includes('name="examSala3" value="Teste Vestibular"') || html.includes('name="examSala3" value="Teste Otoneurológico"')) throw new Error("Exame incorreto ou sala errada"); if (!html.includes('name="examSala4" value="Teste Vestibular"') || !html.includes('name="examSala4" value="Teste Otoneurológico"')) throw new Error("Exames complementares devem estar na Sala 4"); for (const term of ["/api/document","/documentos/","$path -eq \"/sala\"","/sala"]) if (!server.includes(term)) throw new Error("Rota do servidor ausente: "+term); console.log("Requisitos FAVMED: OK");'
      - name: Validar sintaxe do PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'servidor-favmed.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          Write-Host 'PowerShell syntax OK'
